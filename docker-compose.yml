version: "3.8"
services:
  backend:
    build: .
    command: ["node", "server.js"]
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      FLEET_SIZE: ${FLEET_SIZE:-25}
      UPDATE_INTERVAL_MS: ${UPDATE_INTERVAL_MS:-5000}
      PAYLOAD_PADDING_BYTES: ${PAYLOAD_PADDING_BYTES:-0}
      BROADCAST_INTERVAL_MS: ${BROADCAST_INTERVAL_MS:-500}
      HISTORY_ENABLED: ${HISTORY_ENABLED:-true}
      DB_PATH: /data/fleet_history.db
    volumes:
      - fleet_data:/data
    restart: unless-stopped

  simulator:
    build: .
    command: ["node", "simulator.js"]
    environment:
      BACKEND_INGEST_URL: ws://backend:8080/ingest
      BACKEND_HTTP_URL: http://backend:8080
      FLEET_SIZE: ${FLEET_SIZE:-25}
      UPDATE_INTERVAL_MS: ${UPDATE_INTERVAL_MS:-5000}
      PAYLOAD_PADDING_BYTES: ${PAYLOAD_PADDING_BYTES:-0}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fleet_data:
